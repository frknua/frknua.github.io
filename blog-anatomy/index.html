pt id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"post":{"title":{"tr":"Kod. Mimari. Deneyim: Bu Blogun Anatomisi","en":"Code. Architecture. Experience: The Anatomy of This Blog"},"slug":"blog-anatomy","creationDate":"2025-03-06","tags":[{"id":1,"name":"Web","slug":"web"},{"id":2,"name":"Next.js","slug":"nextjs"}],"content":"\u003c!-- tr --\u003e\n\u003cp\u003eBir geliştirici için blog tutmak sadece bilgi paylaşmak değildir; aynı zamanda kendi mühendislik disiplinini dünyaya sergilediği bir vitrindir. Bu ilk yazıda, şu an okuduğunuz bu platformun arkasındaki mimariyi, kod kararlarını ve kullanıcı deneyimi hedeflerini detaylandırıyorum.\u003c/p\u003e\n\u003ch2\u003e1. Mimari Tasarım: Mutfak ve Vitrin\u003c/h2\u003e\n\u003cp\u003eGüvenlik ve açık kaynak felsefesini dengelemek adına \"Kasa-Vitrin\" modelini tercih ettim. Kaynak kodlar ve ham makalelerim \u003cstrong\u003ePrivate\u003c/strong\u003e bir repoda (Mutfak) dururken, sadece derlenmiş statik dosyalar \u003cstrong\u003ePublic GitHub Pages\u003c/strong\u003e reposuna (Vitrin) aktarılıyor. Bu sayede içeriklerim ve mimari detaylarım güvende kalırken, dünya sadece \"hazır\" olanı görüyor.\u003c/p\u003e\n\u003ch2\u003e2. İçerik Yönetimi: Markdown ve Çoklu Dil\u003c/h2\u003e\n\u003cp\u003eİçerikleri veritabanı yerine statik \u003cstrong\u003e.md (Markdown)\u003c/strong\u003e dosyaları üzerinden yönetiyorum. Her makale, içinde hem Türkçe hem de İngilizce içeriği barındıran tek bir dosya üzerinde yükseliyor. Bu yapı, hem git üzerinden versiyon takibini kolaylaştırıyor hem de build anında saniyeler içinde statik sayfalara dönüşüyor.\u003c/p\u003e\n\u003ch2\u003e3. Teknik Stack: Page Router ve Tailwind CSS\u003c/h2\u003e\n\u003cp\u003eHız ve SEO optimizasyonu için \u003cstrong\u003eNext.js Page Router\u003c/strong\u003e yapısını seçtim. Tasarım tarafında ise \u003cstrong\u003eTailwind CSS\u003c/strong\u003e'in gücünden yararlandım.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eDark \u0026#x26; Light Mode:\u003c/strong\u003e İşletim sistemi tercihlerine veya kullanıcı seçimine duyarlı, monokrom bir gece/gündüz deneyimi.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eModern Arayüz:\u003c/strong\u003e Utility-first yaklaşımıyla, temiz kodun tasarım üzerindeki doğrudan yansıması.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4. Kod Blokları ve IDE Deneyimi\u003c/h2\u003e\n\u003cp\u003eTeknik bir blogun kalbi kod parçalarıdır. \u003cstrong\u003eShiki\u003c/strong\u003e kullanarak birden fazla dosyanın aynı kutuda gösterildiği \u003cstrong\u003esekmeli yapı\u003c/strong\u003e ve tek tıkla kopyalama özelliğiyle dökümantasyon kalitesinde bir deneyim inşa ettim.\u003c/p\u003e\n\u003ch2\u003e5. CI/CD: GitHub Actions Otomasyonu\u003c/h2\u003e\n\u003cp\u003eSürekli entegrasyonu sağlamak adına \u003cstrong\u003eGitHub Actions\u003c/strong\u003e iş akışlarını kurguladım. Private repoya her \u003ccode\u003epush\u003c/code\u003e yapıldığında, otomasyon devreye girerek projeyi derliyor ve saniyeler içinde Public repoya aktarıyor.\u003c/p\u003e\n\u003ch2\u003e6. PWA: Blog Artık Bir Uygulama\u003c/h2\u003e\n\u003cp\u003eDeneyimi bir üst seviyeye taşımak için projemize \u003cstrong\u003ePWA (Progressive Web App)\u003c/strong\u003e desteği ekledik. Bu sayede blogu cihazınıza bir uygulama gibi yükleyebilir, çevrimdışı (offline) olduğunuzda bile önbelleğe alınmış makalelere erişebilirsiniz. Mimari açıdan bu, içeriğin her zaman ulaşılabilir olmasını garanti altına alıyor.\u003c/p\u003e\n\u003cp\u003eKodlamaya devam! 🚀\u003c/p\u003e\n\u003c!-- en --\u003e\n\u003cp\u003eFor a developer, blogging is not just about sharing information; it is a showcase of their engineering discipline. In this first post, I detail the architecture, code decisions, and UX goals behind this platform you are reading right now.\u003c/p\u003e\n\u003ch2\u003e1. Architectural Design: Kitchen and Showcase\u003c/h2\u003e\n\u003cp\u003eTo balance security and open-source philosophy, I chose the \"Safe-Showcase\" model. My source code and raw articles reside in a \u003cstrong\u003ePrivate\u003c/strong\u003e repo (Kitchen), while only the compiled static files are deployed to the \u003cstrong\u003ePublic GitHub Pages\u003c/strong\u003e repo (Showcase). This ensures that my core logic and raw contents remain protected while the world sees only the \"final product.\"\u003c/p\u003e\n\u003ch2\u003e2. Content Management: Markdown \u0026#x26; Multi-language\u003c/h2\u003e\n\u003cp\u003eI manage contents through static \u003cstrong\u003e.md (Markdown)\u003c/strong\u003e files instead of a database. Each article rises on a single file containing both Turkish and English content. This structure simplifies version tracking via Git and converts into static pages within seconds during the build process.\u003c/p\u003e\n\u003ch2\u003e3. Tech Stack: Page Router and Tailwind CSS\u003c/h2\u003e\n\u003cp\u003eI chose \u003cstrong\u003eNext.js Page Router\u003c/strong\u003e for speed and SEO optimization. On the design side, I leveraged the power of \u003cstrong\u003eTailwind CSS\u003c/strong\u003e.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eDark \u0026#x26; Light Mode:\u003c/strong\u003e A monochrome night/day experience responsive to system preferences or user choice.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eModern Interface:\u003c/strong\u003e A direct reflection of clean code on design with a utility-first approach.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4. Code Blocks and IDE Experience\u003c/h2\u003e\n\u003cp\u003eThe heart of a technical blog is its code snippets. Using \u003cstrong\u003eShiki\u003c/strong\u003e, I built a documentation-quality experience featuring bracket pair colorization, a \u003cstrong\u003etabbed structure\u003c/strong\u003e showing multiple files in the same block, and a one-click copy feature.\u003c/p\u003e\n\u003ch2\u003e5. CI/CD: GitHub Actions Automation\u003c/h2\u003e\n\u003cp\u003eI configured \u003cstrong\u003eGitHub Actions\u003c/strong\u003e workflows to ensure continuous integration. Every time a \u003ccode\u003epush\u003c/code\u003e is made to the private repo, automation kicks in to compile the project and deploy it to the Public repo within seconds.\u003c/p\u003e\n\u003ch2\u003e6. PWA: The Blog is Now an App\u003c/h2\u003e\n\u003cp\u003eTo take the experience to the next level, I integrated \u003cstrong\u003ePWA (Progressive Web App)\u003c/strong\u003e support. This allows you to install the blog as an app on your device and access cached articles even when offline. Architecturally, this guarantees that the content is always reachable.\u003c/p\u003e\n\u003cp\u003eKeep Coding! 🚀\u003c/p\u003e","isActive":true,"references":[{"title":"Next.js Page Router Documentation","url":"https://nextjs.org/docs/pages/building-your-application/routing"},{"title":"Tailwind CSS Dark Mode Guide","url":"https://tailwindcss.com/docs/dark-mode"},{"title":"GitHub Actions for GitHub Pages","url":"https://github.com/features/actions"},{"title":"Progressive Web Apps (PWA) Overview","url":"https://web.dev/progressive-web-apps/"}]},"nextPost":null},"__N_SSG":true},"page":"/[slug]","query":{"slug":"blog-anatomy"},"buildId":"H_bIGHmGGfVIs_vZnaLfY","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
